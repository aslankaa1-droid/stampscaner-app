name: stampscaner_app
description: "StampScaner — премиальная экспертиза почтовых марок. Распознавание, оценка, сертификат за подписью Аслана Каа."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Camera & image
  camera: ^0.11.1
  image_picker: ^1.1.2
  image: ^4.5.4

  # Local DB
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Preferences
  shared_preferences: ^2.3.4

  # UI helpers
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1

  # Intl (locale-aware dates / numbers)
  intl: ^0.20.1

  # Permissions
  permission_handler: ^11.3.1

  # Sharing & saving
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#6B1F2E"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F8F2E4"
  image: "assets/images/splash.png"
  color_dark: "#1A1410"
  image_dark: "assets/images/splash.png"
  android_12:
    color: "#6B1F2E"
    image: "assets/images/icon_foreground.png"
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  # Fonts are loaded at runtime via google_fonts package — no local TTF needed.
  # When packaging for offline-first use, drop TTFs into assets/fonts/ and
  # reinstate the fonts: block here.
