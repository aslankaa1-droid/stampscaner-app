name: stampscaner_app
description: "StampScaner — премиальная экспертиза почтовых марок. Распознавание, оценка, сертификат за подписью Аслана Каа."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Camera & image
  camera: ^0.11.1
  image_picker: ^1.1.2
  image: ^4.5.4

  # Local DB
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Preferences
  shared_preferences: ^2.3.4

  # UI helpers
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1

  # Intl (locale-aware dates / numbers)
  intl: ^0.20.1

  # Permissions
  permission_handler: ^11.3.1

  # Sharing & saving
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
        - asset: assets/fonts/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
